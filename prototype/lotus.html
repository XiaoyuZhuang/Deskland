<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>荷塘 · Sylvaframe</title>
  <link rel="icon" type="image/png" href="assets/sylvaframe.png">
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #204f55; }
    #pond, #icons { position: fixed; inset: 0; width: 100%; height: 100%; }
    #icons { pointer-events: none; }
    .icon { position: absolute; display: grid; box-sizing: border-box; justify-items: center;
      align-content: start; gap: 6px; padding-top: 4px; }
    .icon::before { content: ""; width: min(42%, 32px); height: 25px; margin-top: 6px;
      border-radius: 4px; background: linear-gradient(#ffe6a8, #e9b966);
      box-shadow: 0 3px 8px #102f4766, inset 0 1px #fff8; }
    .icon:nth-child(3n+2)::before { width: min(33%, 24px); height: 29px; margin-top: 2px;
      background: repeating-linear-gradient(#bccbc4 0 1px, transparent 1px 4px) center / 55% 44% no-repeat,
        linear-gradient(#f6f5e6, #dfe7da); }
    .icon::after { content: ""; width: 61%; height: 5px; border-radius: 3px; background: #fff9; }
  </style>
</head>
<body>
  <canvas id="pond" aria-hidden="true"></canvas>
  <div id="icons" aria-hidden="true"></div>
  <script src="lotus.js"></script>
  <script src="share.js"></script>
</body>
</html>
